# Builds de iOS para TestFlight en Codemagic.
#
# Se dispara a mano (Start new build → master → ios-testflight) o al pushear
# un tag testflight-*:
#   git tag testflight-1 && git push origin testflight-1
#
# La firma la arma el build: con la clave de API de App Store Connect (Team
# settings → Integrations → Developer Portal, nombre en
# `integrations.app_store_connect`) busca en Apple el certificado de
# distribución y el perfil de App Store, y los crea si no existen. El
# certificado usa la clave privada CERTIFICATE_PRIVATE_KEY del grupo de
# variables `ios_signing` (secreta; si se pierde, se genera otra y Apple crea
# un certificado nuevo).
#
# La key de iOS de Intercom (chat de soporte) va como variable secreta
# INTERCOM_IOS_API_KEY en el grupo `ios_signing`.

workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: dovia_asc
    environment:
      flutter: 3.44.2
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: com.doviaapp.dovia
        # "ID de Apple" de la app en App Store Connect → Información de la app.
        APP_STORE_APPLE_ID: 6825416376
        # Backend al que apunta el build (iOS no tiene flavors: una sola app).
        API_BASE_URL: https://52aqw5tygf.execute-api.us-east-2.amazonaws.com/staging
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'testflight-*'
          include: true
    scripts:
      - name: Firma
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Dependencias
        script: |
          flutter pub get
          cd ios && pod install --repo-update
      - name: Build del IPA
        script: |
          # Cada subida a TestFlight necesita un número de build mayor.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=INTERCOM_IOS_API_KEY="$INTERCOM_IOS_API_KEY" \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Símbolos para Crashlytics
        script: |
          # Sin los dSYM los crashes de iOS llegan sin nombres de funciones.
          # La config de Firebase se pasa desde Dart (no hay
          # GoogleService-Info.plist en el repo): se arma uno mínimo con los
          # mismos valores de lib/notifications/firebase_push_messaging.dart.
          # Si falla no frena la subida a TestFlight.
          PLIST=/tmp/GoogleService-Info.plist
          cat > "$PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>API_KEY</key><string>AIzaSyBGsuuNXcPyScRKKGon2J0vQBdswbzyv2U</string>
            <key>GCM_SENDER_ID</key><string>240336837682</string>
            <key>PROJECT_ID</key><string>dovia-notifications</string>
            <key>BUNDLE_ID</key><string>$BUNDLE_ID</string>
            <key>GOOGLE_APP_ID</key><string>1:240336837682:ios:4b87b12a08a1b5542df02b</string>
          </dict></plist>
          EOF
          find build/ios/archive/Runner.xcarchive/dSYMs -name "*.dSYM" -print0 |
            xargs -0 -I {} ios/Pods/FirebaseCrashlytics/upload-symbols -gsp "$PLIST" -p ios {} ||
            echo "No se pudieron subir los dSYM a Crashlytics"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Sólo testers internos: el build queda en TestFlight sin pasar por la
        # revisión de Apple. Para externos, completar la información de prueba
        # en TestFlight y pasar a true (con beta_groups).
        submit_to_testflight: false
